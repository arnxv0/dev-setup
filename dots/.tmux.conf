set -g default-terminal "tmux-256color"
set -s escape-time 0

# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix
set -g status-style 'bg=#1f2b33 fg=#7fc8e8'
set -g base-index 1

# Make it obvious which project the current pane belongs to. Session names are
# now <2-char parent>-<folder> (see tmux-sessionizer), which disambiguates
# same-named folders; the right side shows the actual path so there is never any
# doubt about which "blit" or "src" you are sitting in.
set -g status-left-length 36
set -g status-left '#[bold]#[fg=#9ad9ff] #S #[default]'
set -g status-right-length 70
set -g status-right '#[fg=#7fc8e8]#{b:pane_current_path}#[fg=#5a7d91]  #{s|#{HOME}|~|:pane_current_path} '
set -g window-status-current-format '#[bold]#[fg=#9ad9ff][#I:#W]'
set -g window-status-format '#[fg=#5a7d91]#I:#W'

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# New windows / splits open where the current pane is. tmux's default is the
# session's start directory, which for a restored session used to be ~.
bind c   new-window      -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/personal/dev/todo.md"

bind-key -r f run-shell "tmux neww ~/.local/custom_setup_bin/tmux-sessionizer"

# ── scrollback ───────────────────────────────────────────────────────────────
# resurrect's capture-pane can only save what tmux still holds; default is 2000.
set -g history-limit 50000

# ── alternate session, like nvim's Ctrl-^ for files ──────────────────────────
# NOTE: the -r belongs to `bind` (repeatable key). Do NOT move it onto
# switch-client -- that flag toggles the client *readonly*.
# This replaces the default `o` (select-pane); h/j/k/l above cover pane nav.
bind -r o switch-client -l

# ── session persistence ──────────────────────────────────────────────────────
# Capture is automatic; RESTORE IS SELECTIVE via tmux-sessionizer (prefix+f),
# so a reboot does not spawn every pane at once.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Refresh our own snapshot on continuum's tick. The snapshot records the
# claude-pane -> session-id mapping, which resurrect does not capture and which
# cannot be reconstructed once the pane is gone.
# NOTE: resurrect eval's this hook as a SHELL command, not a tmux command --
# putting `run-shell` here fails with "run-shell: command not found".
set -g @resurrect-hook-post-save-all '$HOME/.local/custom_setup_bin/tmux-snapshot >/dev/null 2>&1 || true'

# Close the current session WITHOUT losing its saved state. Snapshots first,
# so the save reflects what was on screen rather than the last 15-minute tick.
# (prefix+x is kill-pane; X is free.)
bind-key X run-shell "~/.local/custom_setup_bin/tmux-close >/dev/null 2>&1"

# Manual snapshot / restore-picker
bind-key -r S run-shell "tmux display-message 'snapshotting...' ; ~/.local/custom_setup_bin/tmux-snapshot >/dev/null 2>&1 && tmux display-message 'tmux state snapshotted' || tmux display-message 'snapshot FAILED'"

run '~/.tmux/plugins/tpm/tpm'
